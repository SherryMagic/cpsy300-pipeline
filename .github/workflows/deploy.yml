name: Build and deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: acrliang2026
  RESOURCE_GROUP: rg-cpsy300-w4d2-sl
  CONTAINERAPP: ca-pipeline-sl

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to the registry
        run: az acr login --name $ACR_NAME

      - name: Build and push
        run: |
          IMAGE=$ACR_NAME.azurecr.io/pipeline:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE

      
      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          imageToDeploy: acrliang2026.azurecr.io/pipeline:${{ github.sha }}
          containerAppName: ca-pipeline-sl
          resourceGroup: rg-cpsy300-w4d2-sl
          acrName: acrliang2026
          acrUsername: ${{ secrets.ACR_USERNAME }}
          acrPassword: ${{ secrets.ACR_PASSWORD }}

